# Insights service (SDD-08, SDD-09 read API): ruff, mypy, pytest against PostgreSQL 16, OpenAPI
# drift (inside the tests) and an image build without push (TST-01 §6, TC-INS-*).
name: ci-insights

on:
  pull_request:
    paths:
      - "services/insights/**"
      - "schemas/**"
      - "tsl/src/**"
      - "docs/architecture/registry.md"
      - ".github/workflows/ci-insights.yml"
  push:
    branches: [main]
    paths:
      - "services/insights/**"
      - "schemas/**"
      - "tsl/src/**"
      - "docs/architecture/registry.md"
      - ".github/workflows/ci-insights.yml"
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-insights-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Empty, throwaway database for the test session only. Trust auth is confined to this job's
      # private network; no data or secret outlives the job (tests/conftest.py).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/insights
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Sync (locked)
        run: uv sync --locked --python 3.12
      - name: Ruff
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: Mypy (strict)
        run: uv run --locked mypy
      - name: Pytest (PostgreSQL 16 service, no network beyond it)
        env:
          INSIGHTS_TEST_PG_PORT: "5432"
          INSIGHTS_TEST_PG_HOST: "127.0.0.1"
        run: uv run --locked pytest -q
      - name: Build image (no push)
        working-directory: .
        run: docker build -f services/insights/Dockerfile -t truminds/insights:ci .
