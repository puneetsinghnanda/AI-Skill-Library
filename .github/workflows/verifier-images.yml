# Verifier images (OPS-03 §2.1, SDD-03 §5.5). Builds every plugins/truminds/verifiers/<name>@<major>/
# that has a Dockerfile when it changes, pushes it, and prints the digest. Profiles reference images
# by digest only, so the digest goes into profile.yaml through a normal reviewed PR (never by CI).
name: verifier-images

on:
  push:
    branches: [main]
    paths:
      - "plugins/truminds/verifiers/**"
      - ".github/workflows/verifier-images.yml"
  pull_request:
    paths:
      - "plugins/truminds/verifiers/**"
      - ".github/workflows/verifier-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verifier-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.find.outputs.profiles }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Find verifier folders with a Dockerfile
        id: find
        run: |
          profiles="$(find plugins/truminds/verifiers -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null \
            | xargs -r -n1 basename | sort | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "profiles=${profiles:-[]}" >> "$GITHUB_OUTPUT"
          echo "verifier images: ${profiles:-[]}"

  build:
    needs: discover
    if: needs.discover.outputs.profiles != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.discover.outputs.profiles) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint Dockerfile (hadolint, pinned by version)
        env:
          PROFILE: ${{ matrix.profile }}
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < "plugins/truminds/verifiers/${PROFILE}/Dockerfile"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Image name (<name>@<major> -> verifier-<name>:<major>)
        id: name
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          echo "image=verifier-${PROFILE%@*}" >> "$GITHUB_OUTPUT"
          echo "major=${PROFILE#*@}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build (push on main only)
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: plugins/truminds/verifiers/${{ matrix.profile }}
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          tags: ${{ vars.REGISTRY || 'local' }}/truminds/${{ steps.name.outputs.image }}:${{ steps.name.outputs.major }}-${{ github.sha }}
      - name: Digest for profile.yaml
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          echo "### ${PROFILE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set \`image:\` in plugins/truminds/verifiers/${PROFILE}/profile.yaml to the digest \`${DIGEST}\` in a reviewed PR." >> "$GITHUB_STEP_SUMMARY"
