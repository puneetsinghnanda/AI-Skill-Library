# Portal (SDD-09): lint, typecheck, contrast and OpenAPI drift gates, Vitest, build with the bundle
# gate (TC-POR-010), Playwright with axe on Chromium (TST-01 §6, TC-POR-001..012).
name: ci-portal

on:
  pull_request:
    paths:
      - "portal/**"
      - "services/insights/openapi/**"
      - ".github/workflows/ci-portal.yml"
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "services/insights/openapi/**"
      - ".github/workflows/ci-portal.yml"
  workflow_call:
    inputs:
      extra-browsers:
        description: Extra Playwright browsers besides Chromium (release passes "firefox webkit", OPS-03 §3)
        type: string
        default: ""
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-portal-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portal
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: portal/.nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, Stylelint, Prettier)
        run: npm run lint
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Token contrast (TC-POR-012)
        run: npm run check:tokens
      - name: OpenAPI drift (TC-POR-009)
        run: npm run check:api
      - name: Vitest + Testing Library + axe
        run: npm test
      - name: Build and bundle gate (TC-POR-010)
        run: npm run build
      - name: Install Playwright browsers
        env:
          PW_EXTRA_BROWSERS: ${{ inputs.extra-browsers }}
        run: |
          read -r -a extra <<< "$PW_EXTRA_BROWSERS"
          npx playwright install --with-deps chromium "${extra[@]}"
      - name: Playwright e2e with axe (TC-POR-001..006, 011)
        env:
          PW_EXTRA_BROWSERS: ${{ inputs.extra-browsers }}
        run: npm run e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portal-test-results
          path: portal/test-results
          retention-days: 7
