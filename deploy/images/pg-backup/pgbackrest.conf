# pgBackRest configuration (OPS-01 §9). Non-secret settings only.
# Repository location comes from /etc/truminds/backup.env (PGBACKREST_REPO1_S3_* variables, see
# deploy/compose/env/backup.env.example). The cipher passphrase and storage keys are Docker secrets
# exported by /usr/local/bin/pgbr at run time; they are never written to this file.
[global]
repo1-type=s3
repo1-path=/truminds-insights
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# 35 days of restore points (OPS-01 §9.2); WAL kept for every retained full backup.
repo1-retention-full-type=time
repo1-retention-full=35
repo1-retention-archive-type=full
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[insights]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
