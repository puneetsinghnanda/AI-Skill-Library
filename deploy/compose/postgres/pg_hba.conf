# PostgreSQL client authentication for the single-VM baseline (OPS-01 §7.1, §8.1).
# - Unix socket: the postgres OS user only (initdb scripts, pgBackRest in the backup container, which
#   shares the socket volume and runs as the same uid).
# - TCP: TLS only, SCRAM only, the four insights roles only, insights database only. The `db` compose
#   network is internal, so no host outside the VM reaches this port.
# TYPE    DATABASE   USER                                                     ADDRESS      METHOD
local     all        postgres                                                              peer
local     all        all                                                                   reject
hostssl   insights   insights_owner,insights_app,insights_read,insights_reveal 0.0.0.0/0   scram-sha-256
host      all        all                                                      0.0.0.0/0    reject
host      all        all                                                      ::/0         reject
