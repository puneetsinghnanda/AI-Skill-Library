# One-machine TEST environment for the test phase (ADR 0006): GitHub sign-in, TEST ENVIRONMENT
# banner, PostgreSQL in the same project. Not for production (use compose.prod.yml).
# Steps: deploy/README.md "Run the test environment on one machine for 6 testers".
#
#   deploy/scripts/test-env-secrets.sh
#   cp deploy/compose/env/test.env.example deploy/compose/env/test.env   # then fill it in
#   docker compose -f deploy/compose/compose.test.yml up -d --build
#
# No secret is in this file: the env file and test-secrets/ are git-ignored host files.
name: truminds-test

x-insights: &insights
  build:
    context: ../..
    dockerfile: deploy/images/test-env/Dockerfile
  image: truminds/insights-test:local
  env_file: [env/test.env]
  read_only: true
  tmpfs: [/tmp]
  user: "10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [db, egress]
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}

services:
  api:
    <<: *insights
    command: ["api"]
    ports:
      - "${TEST_BIND:-0.0.0.0}:${TEST_PORT:-8000}:8000"   # portal, read API, tsl, GitHub sign-in
    secrets: [db_app_password, db_read_password, db_reveal_password, pepper, data_key]
    healthcheck:
      test: ["CMD", "python", "-m", "app.entry", "probe", "ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *insights
    command: ["worker"]
    secrets: [db_app_password, pepper, data_key]
    depends_on:
      migrate: {condition: service_completed_successfully}

  migrate:
    <<: *insights
    command: ["migrate"]
    secrets: [db_owner_password]
    networks: [db]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  admin:                                   # docker compose -f ... run --rm admin catalogue sync ...
    <<: *insights
    command: ["admin", "--help"]
    secrets: [db_app_password, db_owner_password, pepper, data_key]
    networks: [db]
    restart: "no"
    profiles: [admin]
    volumes:
      - ../..:/srv/catalogue:ro            # the repository, for `admin catalogue sync`

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "timezone=UTC"]
    volumes:
      - pgdata:/var/lib/postgresql/data    # keep Docker's data root on an encrypted disk
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    secrets: [db_superuser_password, db_owner_password, db_app_password, db_read_password, db_reveal_password]
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

networks:
  db: {internal: true}
  egress: {}                               # api and worker reach api.github.com / github.com

volumes:
  pgdata: {}

secrets:                                   # written by deploy/scripts/test-env-secrets.sh
  db_superuser_password: {file: ./test-secrets/db_superuser_password}
  db_owner_password:     {file: ./test-secrets/db_owner_password}
  db_app_password:       {file: ./test-secrets/db_app_password}
  db_read_password:      {file: ./test-secrets/db_read_password}
  db_reveal_password:    {file: ./test-secrets/db_reveal_password}
  pepper:                {file: ./test-secrets/pepper}
  data_key:              {file: ./test-secrets/data_key}
