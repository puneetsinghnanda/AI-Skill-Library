# Edge reverse proxy (OPS-01 §6.3, §7.1, §3.1-§3.2).
#
#   :8080  plain HTTP, redirects to HTTPS only
#   :8443  intranet server: portal at /, API at /v1/ and /otel/. Certificate from the company internal CA.
#   :9443  public server (option E1, OPS-01 §3.2): exact path allowlist for GitHub and the CI action
#          only, everything else 404. Certificate from a public CA. Publish this port only on the DMZ
#          interface, and only if Puneet chooses E1; under E2 remove the server block.
#
# Never routed: /metrics (ports 9100/9101 are not proxied at all) and /v1/health/ready.
# TLS keys are mounted read-only from /run/truminds-secrets/tls (fetch-secrets.sh). No secret in git.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65s;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Access log: path without query string, no headers (Authorization and X-Hub-Signature-256 are
  # never logged, OPS-02 §6.2).
  log_format edge escape=json '{"ts":"$time_iso8601","server":"$server_port","method":"$request_method",'
                              '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration_s":$request_time,"upstream_s":"$upstream_response_time"}';
  access_log /dev/stdout edge;

  # Docker's embedded DNS; re-resolve so both api replicas get traffic and restarts are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  # ---- TLS (OPS-01 §7.1): TLS 1.2 and 1.3 only
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # A CI ingest token is "tsi_ci_<random>" (services/insights/app/auth/ingest_tokens.py). The public
  # server admits only those on its CI paths; Entra bearer tokens stay intranet-only (OPS-01 §3.1).
  map $http_authorization $ci_bearer {
    default 0;
    "~^Bearer tsi_ci_[A-Za-z0-9_-]{20,}$" 1;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  # ------------------------------------------------------------------ HTTP: redirect only
  server {
    listen 8080 default_server;
    server_name _;
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ------------------------------------------------------------------ intranet server
  server {
    listen 8443 ssl http2 default_server;  # "http2 on;" once the pinned nginx is >= 1.25.1
    server_name _;
    ssl_certificate     /etc/nginx/tls/intranet.crt;
    ssl_certificate_key /etc/nginx/tls/intranet.key;

    set $api    api:8000;
    set $portal portal:8080;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Probe and metrics endpoints are internal only (OPS-02 §4.1).
    location = /metrics          { return 404; }
    location = /v1/health/ready  { return 404; }

    # API. Event batches are at most 1 MiB (SDD-08 §4.1).
    location ^~ /v1/ {
      client_max_body_size 1m;
      proxy_pass http://$api;
    }

    # OTLP/HTTP from Claude Code; gzip bodies pass through untouched (SDD-08 §5.1).
    location ^~ /otel/ {
      client_max_body_size 4m;
      gzip off;
      proxy_pass http://$api;
    }

    # GitHub sign-in on the api (test phase only, ADR 0006); 404 from the api unless
    # IDENTITY_PROVIDER=github. /auth/callback stays a portal (MSAL) route.
    location ^~ /auth/github/ {
      client_max_body_size 16k;
      proxy_pass http://$api;
    }
    location = /auth/logout {
      client_max_body_size 16k;
      proxy_pass http://$api;
    }

    # Portal (static SPA). Same origin as the API, so no CORS. MSAL needs the Entra login host.
    location / {
      client_max_body_size 16k;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      proxy_pass http://$portal;
    }
  }

  # ------------------------------------------------------------------ public server (option E1)
  # Exactly the "Yes" rows of OPS-01 §3.1. Everything else returns 404 at the edge.
  server {
    listen 9443 ssl http2;
    server_name _;
    ssl_certificate     /etc/nginx/tls/public.crt;
    ssl_certificate_key /etc/nginx/tls/public.key;

    set $api api:8000;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # GitHub webhooks, verified by HMAC in the service (SDD-08 §6.1).
    location = /v1/webhooks/github {
      limit_except POST { deny all; }
      client_max_body_size 1m;
      proxy_pass http://$api;
    }

    # tsl-ci-verify: ci.verified events with the CI ingest token only.
    location = /v1/events {
      limit_except POST { deny all; }
      if ($ci_bearer = 0) { return 404; }
      proxy_pass http://$api;
    }

    # tsl ci-verify: key lookup (key_<ULID>) and signature facts, CI token only.
    location ~ "^/v1/keys/key_[0-9A-HJKMNP-TV-Z]{26}$" {
      limit_except GET { deny all; }
      if ($ci_bearer = 0) { return 404; }
      proxy_pass http://$api;
    }

    location = /v1/signatures/verify {
      limit_except POST { deny all; }
      if ($ci_bearer = 0) { return 404; }
      proxy_pass http://$api;
    }

    location / {
      return 404;
    }
  }
}
