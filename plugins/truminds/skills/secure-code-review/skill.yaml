# Skill code: SC (SDD-01 §12). R1 target status: production.
# evals: 10 cases with the SDD-01 §10.3 mix (GAP-03); a signed eval result is still needed (SKL-V13).
schema: skill-metadata.v1
id: secure-code-review
version: 1.0.1
agent: security
status: production
owner: skill-owner-8b5d
title: Secure code review
phase: build
summary: Reviews a code change for security issues and attaches the SAST and secrets scan results by hash.
inputs:
- name: change
  schema: change.v1
  source: artifact
  required: true
- name: conventions
  source: context
  path: context/conventions.md
  required: false
- name: architecture
  source: context
  path: context/architecture.md
  required: false
outputs:
- name: secure_review
  schema: secure-review.v1
  file: secure-review.md
context_sections:
- architecture
- conventions
- dependency-graph
size_budget_tokens: 60000
rubric: rubric.md
checks: checks.yaml
evals:
  path: evals/
  min_cases: 10
  min_pass_rate: 0.9
allowed_tools:
- Read
- Grep
- Glob
- Write
change_limits: null
deprecated_by: null
harness:
  checks: checks.yaml
  trace_required: false
