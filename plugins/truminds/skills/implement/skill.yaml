# Skill code: IM (SDD-01 §12). R1 target status: production.
# evals: 10 cases with the SDD-01 §10.3 mix (GAP-03); a signed eval result is still needed (SKL-V13).
schema: skill-metadata.v1
id: implement
version: 1.0.1
agent: developer
status: production
owner: skill-owner-6f3b
title: Implement
phase: build
summary: Implements an approved design or triage inside the change limits and summarises the change.
inputs:
- name: design
  schema: design.v1
  source: artifact
  required: false
- name: stories
  schema: stories.v1
  source: artifact
  required: false
- name: triage
  schema: triage.v1
  source: artifact
  required: false
- name: conventions
  source: context
  path: context/conventions.md
  required: true
- name: module_map
  source: context
  path: context/generated/module-map.json
  required: true
outputs:
- name: change
  schema: change.v1
  file: change.md
- name: code
  kind: code
context_sections:
- conventions
- architecture
- module-map
size_budget_tokens: 90000
rubric: rubric.md
checks: checks.yaml
evals:
  path: evals/
  min_cases: 10
  min_pass_rate: 0.9
allowed_tools:
- Read
- Grep
- Glob
- Write
- Edit
change_limits:
  lines: 400
  files: 15
  sensitive_paths:
  - '**/auth/**'
  - '**/crypto/**'
  - '**/payments/**'
  - '**/migrations/**'
  - .github/**
deprecated_by: null
harness:
  checks: checks.yaml
  trace_required: true
