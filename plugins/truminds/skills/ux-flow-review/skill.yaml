# Skill code: UF (SDD-01 §12). R1 target status: pilot.
# evals.min_cases stays 10 (schema minimum); this folder ships 3 starter cases, see README.
schema: skill-metadata.v1
id: ux-flow-review
version: 1.0.0
agent: ux-designer
status: pilot
owner: skill-owner-ad7f
title: UX flow review
phase: design
summary: Reviews a design file's user flows and cites the design-tool node of every finding.
inputs:
- name: ticket
  schema: ticket-snapshot.v1
  source: run
  required: true
- name: design_file
  source: mcp
  required: true
- name: intent_baseline
  source: context
  path: context/intent-baseline.md
  required: false
outputs:
- name: ux_flow
  schema: ux-flow.v1
  file: ux-flow.md
context_sections:
- intent-baseline
size_budget_tokens: 45000
rubric: rubric.md
checks: checks.yaml
evals:
  path: evals/
  min_cases: 10
  min_pass_rate: 0.9
allowed_tools:
- Read
- Grep
- Glob
- Write
change_limits: null
deprecated_by: null
harness:
  checks: checks.yaml
  trace_required: false
