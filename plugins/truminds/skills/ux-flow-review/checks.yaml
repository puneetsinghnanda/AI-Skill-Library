# SDD-03 §5.2 kind form; check ids follow SDD-03 §5.4. H1, H4, H6 and H7 run for every skill.
# Container checks carry no gate: H3 applies to every skill with a code output (SDD-03 §4.1).
schema: skill-checks.v1
skill: ux-flow-review
artifact_schema: ux-flow.v1
checks:
- id: ux-flow-review.node-cited
  kind: cites-required
  gate: H2
  select: $.findings[*]
- id: ux-flow-review.node-anchor
  kind: regex
  gate: H2
  select: $.findings[*].cites[*]
  must: '#node:[0-9]+:[0-9]+$'
