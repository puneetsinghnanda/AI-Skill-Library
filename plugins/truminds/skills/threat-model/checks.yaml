# SDD-03 §5.2 kind form; check ids follow SDD-03 §5.4. H1, H4, H6 and H7 run for every skill.
# Container checks carry no gate: H3 applies to every skill with a code output (SDD-03 §4.1).
schema: skill-checks.v1
skill: threat-model
artifact_schema: threat-model.v1
checks:
- id: threat-model.stride-per-component
  kind: coverage
  gate: H2
  each_input: design
  each: $.components[*].name
  covered_by: $.threats[*].component
  min: 1
- id: threat-model.ids
  kind: regex
  gate: H2
  select: $.threats[*].id
  must: ^T-[1-9][0-9]*$
- id: threat-model.mitigation-present
  kind: regex
  gate: H2
  select: $.threats[*].mitigation
  must: \S{3,}
