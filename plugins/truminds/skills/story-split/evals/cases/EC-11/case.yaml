schema: eval-case.v1
id: EC-11
title: Hospital time-zone date needs an AC in the window where local and UTC dates differ
kind: edge
inputs:
  intent: inputs/intent.md
expect:
  outcome_in:
  - PASS
  - PASS-WITH-FINDINGS
  gates:
    H1: pass
    H2: pass
    H4: pass
    H5: pass
  assert:
  - path: stories[].trace[]
    any_matches: ^REQ-3$
  # Asia/Kolkata is UTC+05:30: local and UTC dates differ only from 00:00 to 05:29 local.
  # Some AC must place its instant in that window (as local time) and state the UTC side.
  - path: stories[].acceptance_criteria[].text
    any_matches: (?i)^(?=.*(\b(0[0-4]:[0-5][0-9]|05:[0-2][0-9])\b\s*(\(?local|\(?Asia/Kolkata|\(?hospital time)|(local( time)?|Asia/Kolkata|hospital time)( on [^,;]{1,20})?,? (at )?(0[0-4]:[0-5][0-9]|05:[0-2][0-9])\b))(?=.*\bUTC\b)
provenance: invented
