# Skill code: ER (SDD-01 §12). R1 target status: production.
# evals.min_cases stays 10 (schema minimum); this folder ships 3 starter cases, see README.
schema: skill-metadata.v1
id: estimate-review
version: 1.0.0
agent: delivery-manager
status: production
owner: skill-owner-be8a
title: Estimate review
phase: requirements
summary: Sizes each story with cited evidence, or marks it UNSIZED with the question that blocks sizing.
inputs:
- name: ticket
  schema: ticket-snapshot.v1
  source: run
  required: true
- name: stories
  schema: stories.v1
  source: artifact
  required: false
- name: design
  schema: design.v1
  source: artifact
  required: false
- name: module_map
  source: context
  path: context/generated/module-map.json
  required: false
outputs:
- name: estimate
  schema: estimate.v1
  file: estimate.md
context_sections:
- module-map
- architecture
size_budget_tokens: 45000
rubric: rubric.md
checks: checks.yaml
evals:
  path: evals/
  min_cases: 10
  min_pass_rate: 0.9
allowed_tools:
- Read
- Grep
- Glob
- Write
change_limits: null
deprecated_by: null
harness:
  checks: checks.yaml
  trace_required: false
