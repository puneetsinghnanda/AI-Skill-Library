# SDD-03 §5.2 kind form; check ids follow SDD-03 §5.4. H1, H4, H6 and H7 run for every skill.
# Container checks carry no gate: H3 applies to every skill with a code output (SDD-03 §4.1).
schema: skill-checks.v1
skill: estimate-review
artifact_schema: estimate.v1
checks:
- id: estimate-review.evidence-or-unsized
  kind: regex
  gate: H2
  select: $.estimates[?(@.size!='UNSIZED')].evidence[*]
  must: '#'
- id: estimate-review.story-ids
  kind: regex
  gate: H2
  select: $.estimates[*].story
  must: ^S-[1-9][0-9]*$
- id: estimate-review.no-durations
  kind: regex
  gate: soft
  select: $.claims[*].text
  must_not: (?i)\b[0-9]+\s*(h|hours?|days?|weeks?)\b
