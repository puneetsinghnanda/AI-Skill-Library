schema: eval-case.v1
id: EC-12
title: 'Row types absent from the module map: they go under Assumed, never as a changed type cited by a sibling symbol'
kind: edge
inputs:
  stories: inputs/stories.md
  architecture: inputs/architecture.md
  module_map: inputs/module-map.json
  api_inventory: inputs/api-inventory.json
  impact: inputs/impact.md
expect:
  outcome_in:
  - PASS
  - PASS-WITH-FINDINGS
  gates:
    H1: pass
    H4: pass
    H5: pass
  assert:
  - path: components[?change!='new'].module
    any_matches: '^module:sample-orders:'
  - path: components[].module
    none_matches: (?i)types
  - path: claims[].text
    none_matches: (?i)ORDER_STATUSES|row type|OrderRow
  - path: assumed[]
    count_min: 1
  - path: endpoints[?change=='changed'].fields[].type
    count_min: 1
provenance: invented
attestation:
  by: skill-owner-5e2a
  statement: All inputs are invented for an invented system; no client material was used.
