schema: eval-case.v1
id: EC-11
title: 'Changed list endpoint whose story tests an exact date: the new field is named, typed and formatted'
kind: edge
inputs:
  stories: inputs/stories.md
  architecture: inputs/architecture.md
  module_map: inputs/module-map.json
  api_inventory: inputs/api-inventory.json
  impact: inputs/impact.md
expect:
  outcome_in:
  - PASS
  - PASS-WITH-FINDINGS
  gates:
    H1: pass
    H4: pass
    H5: pass
  assert:
  - path: endpoints[?change=='new']
    count_max: 0
  - path: endpoints[?change=='changed'].path
    any_matches: ^/api/orders$
  - path: endpoints[?change=='changed'].fields[].type
    count_min: 1
  - path: endpoints[?change=='changed'].fields[].format
    any_matches: (?i)YYYY-MM-DD|ISO[ -]?8601 date
  - path: endpoints[?change=='changed'].fields[?nullable==`true`]
    count_min: 1
provenance: invented
attestation:
  by: skill-owner-5e2a
  statement: All inputs are invented for an invented system; no client material was used.
