# SDD-03 §5.2 kind form; check ids follow SDD-03 §5.4. H1, H4, H6 and H7 run for every skill.
# Container checks carry no gate: H3 applies to every skill with a code output (SDD-03 §4.1).
schema: skill-checks.v1
skill: test-automation
artifact_schema: test-result.v1
checks:
- id: test-automation.tests-run
  kind: container
  profile_step: test
# Results keep the plan's test ids and covers (SKILL.md rule 6), compared as TP-n/S-n/ACn pairs.
# 1. Every pair of a non-manual planned test has a result that ran (pass or fail; skip does not
#    count). Deferred while the step asks a blocking question, so asking leads to NEEDS-INPUT.
- id: test-automation.results-linked
  kind: coverage
  gate: H2
  defer_on_blocking: true
  each_input: test_plan
  each: $.tests[?(@.level!='manual')]
  each_key:
    prefix: id
    select: $.covers[*]
  covered_by: $.results[?(@.status!='skip')]
  covered_by_key:
    prefix: test_id
    select: $.covers[*]
  min: 1
# 2. Every result pair belongs to a non-manual planned test: no invented test ids, no extra criteria.
- id: test-automation.results-planned
  kind: coverage
  gate: H2
  each: $.results[*]
  each_key:
    prefix: test_id
    select: $.covers[*]
  covered_by_input: test_plan
  covered_by: $.tests[?(@.level!='manual')]
  covered_by_key:
    prefix: id
    select: $.covers[*]
  min: 1
- id: test-automation.only-test-files
  kind: regex
  gate: H5
  select: $.code[*].files[*]
  must: (^|/)(test|tests|__tests__|e2e)/|\.(test|spec)\.[a-z]+$
- id: test-automation.risk
  kind: diff-limit
