# Skill code: PL (SDD-01 §12). R1 target status: pilot.
# evals: 10 cases with the SDD-01 §10.3 mix (GAP-03); a signed eval result is still needed (SKL-V13).
schema: skill-metadata.v1
id: pipeline-review
version: 1.0.1
agent: devops
status: pilot
owner: skill-owner-9c6e
title: Pipeline review
phase: operate
summary: Reviews CI configuration and reports findings that cite the exact job and step.
inputs:
- name: ticket
  schema: ticket-snapshot.v1
  source: run
  required: true
- name: ci_config
  source: product
  path: .github/workflows
  required: true
- name: tsl_config
  source: context
  path: tsl.yaml
  required: false
- name: conventions
  source: context
  path: context/conventions.md
  required: false
outputs:
- name: pipeline_review
  schema: pipeline-review.v1
  file: pipeline-review.md
context_sections:
- conventions
size_budget_tokens: 45000
rubric: rubric.md
checks: checks.yaml
evals:
  path: evals/
  min_cases: 10
  min_pass_rate: 0.9
allowed_tools:
- Read
- Grep
- Glob
- Write
change_limits: null
deprecated_by: null
harness:
  checks: checks.yaml
  trace_required: false
