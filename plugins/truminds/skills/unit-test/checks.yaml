# SDD-03 §5.2 kind form; check ids follow SDD-03 §5.4. H1, H4, H6 and H7 run for every skill.
# Container checks carry no gate: H3 applies to every skill with a code output (SDD-03 §4.1).
schema: skill-checks.v1
skill: unit-test
artifact_schema: ut-result.v1
checks:
- id: unit-test.tests-run
  kind: container
  profile_step: test
- id: unit-test.coverage-not-lower
  kind: container
  profile_step: coverage
- id: unit-test.only-test-files
  kind: regex
  gate: H5
  select: $.code[*].files[*]
  must: (^|/)(test|tests|__tests__)/|\.(test|spec)\.[a-z]+$
- id: unit-test.risk
  kind: diff-limit
