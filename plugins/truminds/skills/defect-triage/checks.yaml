# SDD-03 §5.2 kind form; check ids follow SDD-03 §5.4. H1, H4, H6 and H7 run for every skill.
# Container checks carry no gate: H3 applies to every skill with a code output (SDD-03 §4.1).
schema: skill-checks.v1
skill: defect-triage
artifact_schema: triage.v1
checks:
- id: defect-triage.components-exist
  kind: lookup
  gate: H5
  select: $.candidates[*].component
  in:
    file: context/generated/module-map.json
    path: $.facts[*].id
- id: defect-triage.candidates-cited
  kind: cites-required
  gate: H2
  select: $.candidates[*]
