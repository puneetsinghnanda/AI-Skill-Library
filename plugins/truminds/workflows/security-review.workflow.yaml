# PROPOSED by SDD-10 §4.2 (threat-model -> secure-code-review). secure-code-review needs a change.v1 with the
# verifier's scan hashes, which only a run with an implement step has, so this read-only version runs the threat
# model on the architecture alone. Not in Doc 3 §7.1; awaiting SDD-02 (SDD-10 O-03). Kept at draft.
schema: workflow.v1
id: security-review
version: 1.0.0
title: Security review
description: Threat-model an existing system from its architecture section and get the threat list approved.
owner: wf-owner-2b
kind: read_only
status: draft
requires_fresh_pack: true
inputs:
  ticket: {required: true}
steps:
  - id: threat
    skill: threat-model@^1.0
  - gate: G-threat-review
    role: tech_lead
    after: [threat]
    artifacts: [threat]
    on_reject: threat
