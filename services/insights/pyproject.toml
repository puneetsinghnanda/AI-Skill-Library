[project]
name = "truminds-insights"
version = "0.1.0"
description = "Truminds insights service (SDD-08): telemetry ingest, read API (SDD-09), keys (SDD-07), pods (SDD-10), improvement (SDD-11), admin (SDD-13). Never runs an LLM."
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "PyJWT[crypto]>=2.9",
    "cryptography>=43",
    "prometheus-client>=0.20",
    "PyYAML>=6.0.2",
    "opentelemetry-proto>=1.27",
    "protobuf>=5.27",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-protobuf>=5.27",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = ["docker: needs a running Docker daemon (skipped when unavailable)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]
extend-exclude = ["openapi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603", "S607",               # subprocess with argument lists (pg_ctl, alembic) by design
    "RUF001", "RUF002", "RUF003", # typographic characters in docs
    "B008",                       # FastAPI Depends() in argument defaults is the framework idiom
    "S608",                       # SQL is built from fixed fragments; every value is a bound parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "E501"]
"seed/**" = ["S311"]
"alembic/versions/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "seed"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "google.protobuf.*", "rfc8785", "prometheus_client.*"]
ignore_missing_imports = true
