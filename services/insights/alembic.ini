# Alembic configuration for the insights service (SDD-08 §11.1).
# The database URL is never written here: alembic/env.py builds it from app.config (owner role).
[alembic]
path_separator = os
script_location = alembic
version_locations = alembic/versions
file_template = %%(rev)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
