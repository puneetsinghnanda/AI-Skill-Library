# Local OTLP sink for spikes S-10 and S-11. Receives Claude Code telemetry on localhost only and writes it to a
# file so every metric name, event name and attribute key can be listed. Nothing leaves the laptop.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
exporters:
  file:
    path: /out/claude-code-otel.jsonl
  debug:
    verbosity: basic
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [file, debug]
    logs:
      receivers: [otlp]
      exporters: [file, debug]
