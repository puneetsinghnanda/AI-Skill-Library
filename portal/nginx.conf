# Portal static server (SDD-09 §10, OPS-01 §5.2). Runs as uid 101 on a read-only root filesystem
# with tmpfs on /tmp and /var/cache/nginx (deploy/compose/compose.prod.yml, service `portal`).
# The edge terminates TLS, adds HSTS and routes /v1 and /otel to the api; this server only serves
# the built SPA on :8080 inside the internal `app` network. Same origin for SPA and API: no CORS.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }
  charset utf-8;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_max_body_size 16k;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Path only, no query string or headers (OPS-02 §6.2).
  log_format portal escape=json '{"ts":"$time_iso8601","method":"$request_method","path":"$uri",'
                                '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
  access_log /dev/stdout portal;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # index.html: no-cache; hashed assets: one year, immutable (SDD-09 §10).
  map $uri $tm_cache_control {
    default            "no-cache";
    ~^/assets/         "public, max-age=31536000, immutable";
    ~^/brand/          "public, max-age=3600";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Strict CSP for intranet hosting (SDD-09 §10). Same value as vite.config.ts and the edge.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $tm_cache_control always;

    # Container health check (no API, no auth).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The read API is never served here; a request that reaches this server is a routing mistake.
    location ^~ /v1/ {
      return 404;
    }

    location ^~ /otel/ {
      return 404;
    }

    # No dotfiles, source maps or the demo-only MSW worker.
    location ~ /\. {
      return 404;
    }

    location ~ \.map$ {
      return 404;
    }

    location = /mockServiceWorker.js {
      return 404;
    }

    location ^~ /assets/ {
      try_files $uri =404;
    }

    location ^~ /brand/ {
      try_files $uri =404;
    }

    location = /index.html {
      try_files $uri =404;
    }

    # SPA fallback: every other path is a client route (SDD-09 §3.3).
    location / {
      limit_except GET HEAD {
        deny all;
      }
      try_files $uri /index.html;
    }
  }
}
