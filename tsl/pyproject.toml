[project]
name = "truminds-tsl"
dynamic = ["version"]
description = "tsl: the Truminds Skill Library command-line tool (SDD-04). Runs workflows, checks artifacts, signs records. Never calls an LLM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
dependencies = [
    "typer>=0.27,<0.30",
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "cryptography>=43",
    "PyYAML>=6.0.2",
    "httpx>=0.27",
    "msal>=1.30",
    "keyring>=25",
    "rfc8785>=0.1.4",
]

[project.scripts]
tsl = "tsl.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tsl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tsl"]

# The JSON Schemas in ../schemas are copied into the wheel at build time by
# hatch_build.py (force_include driven by ../schemas/index.json). They are never
# copied by hand into the source tree.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/tsl", "hatch_build.py", "README.md", "tests"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["docker: needs a running Docker daemon (skipped when unavailable)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603",   # subprocess without shell: git and docker are called with argument lists
    "S607",   # partial executable path: git and docker are resolved from PATH by design (SDD-04 §2.2)
    "RUF001", "RUF002", "RUF003",  # typographic characters in user-facing text and docs
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry long literal data (invented tickets, artifacts, JSON bodies).
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src/tsl", "tests"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*", "keyring", "keyring.*", "rfc8785", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
