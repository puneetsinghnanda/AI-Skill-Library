schema: pii.v1
version: 1
rules:
  - id: PII-01
    name: Email address
    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    validator: none
    ignore: [example.com, example.org, example.net, '*.test', '*.invalid', '*.example']
    action: H4
  - id: PII-02
    name: Phone number in E.164 form
    pattern: '\+[1-9][0-9]{9,14}\b'
    validator: none
    action: H4
  - id: PII-03
    name: Phone number in 10-digit national form
    pattern: '\b[0-9]{10}\b'
    validator: none
    context_words: [phone, mobile, tel, contact, call]
    context_window: 30
    action: H4
  - id: PII-06
    name: Payment card
    pattern: '\b(?:[0-9][ -]?){13,19}\b'
    validator: luhn
    action: H4
  - id: PII-07
    name: National id (12 digits, Verhoeff)
    pattern: '\b[0-9]{4}\s?[0-9]{4}\s?[0-9]{4}\b'
    validator: verhoeff
    action: H4
  - id: PII-08
    name: Tax id (PAN format)
    pattern: '\b[A-Z]{5}[0-9]{4}[A-Z]\b'
    validator: pan
    action: H4
  - id: PII-09
    name: IBAN
    pattern: '\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\b'
    validator: mod97
    action: H4
  - id: PII-10
    name: Public IPv4
    pattern: '\b\d{1,3}(\.\d{1,3}){3}\b'
    validator: ipv4-public
    action: soft
