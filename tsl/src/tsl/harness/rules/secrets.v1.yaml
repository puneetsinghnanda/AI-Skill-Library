schema: secrets.v1
version: 1
entropy:
  min_length: 20
  min_bits_per_char: 4.0
  keyword_window: 40
  keywords: [key, secret, token, password]
rules:
  - id: SEC-P-01
    name: Cloud access key id
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
  - id: SEC-P-02
    name: Private key header
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----'
  - id: SEC-P-03
    name: JSON Web Token
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
  - id: SEC-P-04
    name: Source host token
    pattern: '\bgh[pousr]_[A-Za-z0-9]{36}\b'
  - id: SEC-P-05
    name: Connection string with password
    pattern: '(?i)\b(postgres(ql)?|mysql|mongodb(\+srv)?|redis|amqp)://[^:\s/]+:[^@\s]+@'
  - id: SEC-P-06
    name: Generic assignment
    pattern: '(?i)\b(password|passwd|secret|api[_-]?key|token)\s*[:=]\s*["''][^"''\s]{8,}["'']'
    exclude_values: [changeme, example]
  - id: SEC-P-07
    name: Chat platform token
    pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}'
  - id: SEC-P-08
    name: Test canary key (must never reach an artifact)
    pattern: '\bFAKE-KEY-[0-9]{4}-TEST\b'
placeholders: ['<...>', xxxx, example, changeme]
