# Organisation identity and endpoints (SDD-04 §7.1, SDD-07 §1.3).
# This development copy holds placeholders only. A release wheel replaces it at
# build time (hatch_build.py). Nothing at run time can change these values:
# no flag, no environment variable, no file in ~/.truminds or in a repo.
configured = false
tenant_id = "00000000-0000-0000-0000-000000000000"
tsl_client_id = "00000000-0000-0000-0000-000000000000"
api_scope = "api://truminds-insights/Events.Write"
service_url = "https://insights.example.invalid"
companion_remote_template = "git@github.com:{repo}.git"
github_api_url = "https://api.github.com"
# Identity provider (SDD-07 §1.4, ADR 0006): "entra" (production) or "github"
# (interim, test phase). github_* values are used only when provider = "github".
provider = "entra"
github_client_id = ""
github_oauth_url = "https://github.com"
