# promtool unit tests for AL-01..AL-26 (OPS-02 §11, §12): one firing and one quiet case per alert.
# Run: promtool test rules alerts.test.yaml   (generated case table; edit the cases, not the order)
rule_files:
- recording.yaml
- alerts.yaml
evaluation_interval: 1m
tests:
- name: 'AL-01 fires: all api instances down'
  interval: 1m
  input_series:
  - series: up{job="insights-api",instance="api-1"}
    values: '0x10'
  - series: up{job="insights-api",instance="api-2"}
    values: '0x10'
  promql_expr_test:
  - expr: ALERTS{alertname="AL-01_ApiDown",alertstate="firing"}
    eval_time: 5m
    exp_samples:
    - labels: ALERTS{alertname="AL-01_ApiDown",alertstate="firing",severity="P1",team="insights",alert_id="AL-01"}
      value: 1
- name: 'AL-01 quiet: one instance up'
  interval: 1m
  input_series:
  - series: up{job="insights-api",instance="api-1"}
    values: '0x10'
  - series: up{job="insights-api",instance="api-2"}
    values: 1x10
  promql_expr_test:
  - expr: ALERTS{alertname="AL-01_ApiDown",alertstate="firing"}
    eval_time: 5m
    exp_samples: []
- name: 'AL-02 fires: ready failing while up'
  interval: 1m
  input_series:
  - series: up{job="insights-api",instance="api-1"}
    values: 1x10
  - series: probe_success{check="SY-2"}
    values: '0x10'
  - series: probe_http_status_code{check="SY-2"}
    values: 503x10
  promql_expr_test:
  - expr: ALERTS{alertname="AL-02_NotReady",alertstate="firing"}
    eval_time: 6m
    exp_samples:
    - labels: ALERTS{alertname="AL-02_NotReady",alertstate="firing",severity="P1",team="insights",alert_id="AL-02"}
      value: 1
- name: 'AL-02 quiet: suppressed while AL-01 condition holds'
  interval: 1m
  input_series:
  - series: up{job="insights-api",instance="api-1"}
    values: '0x10'
  - series: probe_success{check="SY-2"}
    values: '0x10'
  promql_expr_test:
  - expr: ALERTS{alertname="AL-02_NotReady",alertstate="firing"}
    eval_time: 6m
    exp_samples: []
- name: 'AL-03 fires: 5 percent ingest 5xx'
  interval: 1m
  input_series:
  - series: insights_http_requests_total{route_group="ingest",status_class="2xx",method="POST"}
    values: 0+100x30
  - series: insights_http_requests_total{route_group="ingest",status_class="5xx",method="POST"}
    values: 0+5x30
  promql_expr_test:
  - expr: ALERTS{alertname="AL-03_IngestErrorRate",alertstate="firing"}
    eval_time: 20m
    exp_samples:
    - labels: ALERTS{alertname="AL-03_IngestErrorRate",alertstate="firing",severity="P1",team="insights",alert_id="AL-03"}
      value: 1
- name: 'AL-03 quiet: no ingest 5xx'
